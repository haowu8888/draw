# Draw 白板：构建镜像（含类型检查，依赖层走 Docker 缓存）+ 源码产物包 draw.zip → 部署到主机组并健康检查
# 部署历史按产物包记录版本；重新部署旧版本时本机镜像已清理的话，用当时的产物包重新构建。
#
# 换服务器 / 别人部署：只改下面 deploy.hosts（主机组）和 deploy.target（目录），其余全部来自
# 部署环境（环境与主机 → 环境）的变量和机密，不用改这个文件：
#   DRAW_PUBLIC_URL            变量  用户访问地址，如 https://draw.example.com（必填）
#   DRAW_AUTH_SECRET           机密  至少 32 位随机字符串（必填）
#   DRAW_PORT                  变量  宿主机端口，默认 4180
#   DRAW_TRUSTED_ORIGINS       变量  额外可信来源，逗号分隔，支持 https://*.example.com
#   DRAW_SMTP_HOST / DRAW_SMTP_PORT / DRAW_SMTP_SECURE / DRAW_SMTP_USER / DRAW_SMTP_FROM  变量（可选）
#   DRAW_SMTP_PASS             机密（可选）
#   DRAW_REQUIRE_EMAIL_VERIFICATION  变量（可选，默认有 SMTP 才验证邮箱）
name: draw
source:
  url: https://github.com/haowu8888/draw.git
  branch: main
concurrency:
  group: draw-prod           # 同一时间只有一次发布
retention:
  runs: 50
stages:
  - name: 构建
    jobs:
      - name: image
        runs-on: [docker]
        timeout: 40m
        steps:
          - name: 构建镜像
            run: |
              # 依赖层命中缓存时跳过 npm ci；类型检查在镜像构建里完成
              docker build -t "draw:$FLOW_RUN_NUMBER" -t draw:latest .
              echo "IMAGE=draw:$FLOW_RUN_NUMBER" >> "$FLOW_OUTPUT"
          - name: 打包源码
            run: git archive --format=tar.gz -o draw-src.tar.gz HEAD && ls -l draw-src.tar.gz
          - name: 产物包
            kind: artifact-upload
            with:
              name: draw
              paths: draw-src.tar.gz
              version: ${FLOW_RUN_NUMBER}

  - name: 部署
    jobs:
      - name: deploy-prod
        deploy:
          hosts: prod-server
          artifact: draw             # 产物包解压到 target：/opt/draw/draw-src.tar.gz
          target: /opt/draw
        steps:
          - name: 发布
            run: |
              IMAGE="${IMAGE:-draw:$FLOW_RUN_NUMBER}"
              PORT="${DRAW_PORT:-4180}"
              PUBLIC_URL="${DRAW_PUBLIC_URL:-${DRAW_BASE_URL:-}}"
              [ -n "$PUBLIC_URL" ] || { echo "请在部署环境里设置变量 DRAW_PUBLIC_URL"; exit 1; }
              [ -n "${DRAW_AUTH_SECRET:-}" ] || { echo "请在部署环境里设置机密 DRAW_AUTH_SECRET"; exit 1; }
              if ! docker image inspect "$IMAGE" >/dev/null 2>&1; then
                echo "本机没有镜像 $IMAGE，用产物包重新构建"
                rm -rf src && mkdir src && tar -xzf draw-src.tar.gz -C src
                docker build -t "$IMAGE" src && rm -rf src
              fi
              if docker ps --format '{{.Names}} {{.Ports}}' | grep -v '^draw ' | grep -q ":$PORT->"; then
                echo "端口 $PORT 已被其他容器占用，请修改部署环境的 DRAW_PORT"; exit 1
              fi
              cat > compose.yaml <<'EOF'
              services:
                draw:
                  image: ${IMAGE}
                  container_name: draw
                  restart: unless-stopped
                  env_file: app.env
                  ports:
                    - "0.0.0.0:${DRAW_PORT}:3000"
                  volumes:
                    - draw_data:/data
              volumes:
                draw_data:
              EOF
              umask 077
              printf 'IMAGE=%s\nDRAW_PORT=%s\n' "$IMAGE" "$PORT" > .env
              # 应用配置（同 .env.example），只写已设置的项
              {
                echo "PUBLIC_URL=$PUBLIC_URL"
                echo "AUTH_SECRET=$DRAW_AUTH_SECRET"
                for k in TRUSTED_ORIGINS SMTP_HOST SMTP_PORT SMTP_SECURE SMTP_USER SMTP_PASS SMTP_FROM REQUIRE_EMAIL_VERIFICATION COOKIE_SECURE; do
                  v=$(printenv "DRAW_$k" || true)
                  if [ -n "$v" ]; then echo "$k=$v"; fi
                done
              } > app.env
              echo "发布 $IMAGE → $PUBLIC_URL（宿主机端口 $PORT）"
              docker compose -p draw up -d --remove-orphans
          - name: 健康检查
            run: |
              for i in $(seq 1 40); do
                if curl -fsS "http://127.0.0.1:${DRAW_PORT:-4180}/api/health"; then echo; echo "健康检查通过"; exit 0; fi
                sleep 3
              done
              docker logs --tail 80 draw; exit 1
          - name: 清理旧镜像
            run: |
              docker images draw --format '{{.Tag}}' | grep -E '^[0-9]+$' | sort -rn | tail -n +4 | xargs -r -I{} docker rmi "draw:{}" || true
